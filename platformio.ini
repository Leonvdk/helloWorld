; Firmware build for the wind clock.
;
;   pio run -e esp32dev              build
;   pio run -e esp32dev -t upload    flash
;   pio run -e usb -t upload         flash the mains-powered build
;   pio run -e bench -t upload       flash the needle-fitting sweep
;   pio device monitor               watch the serial log
;
; The unit tests do not need PlatformIO -- run `make test`.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; WiFi credentials. Keep real ones out of the repo: put them in a
    ; local, git-ignored `credentials.ini` and include it here, or pass
    ; them on the command line with `pio run -e esp32dev`.
    -DWINDCLOCK_WIFI_SSID='"${sysenv.WINDCLOCK_WIFI_SSID}"'
    -DWINDCLOCK_WIFI_PASSWORD='"${sysenv.WINDCLOCK_WIFI_PASSWORD}"'

build_unflags = -std=gnu++11

; Mains-powered build: no battery, no sense divider, and a 5-minute update
; interval since there is nothing to conserve. The servo runs off the
; board's 5 V pin, which is the voltage it actually wants.
[env:usb]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DWINDCLOCK_USB_POWERED=1

; Bench mode: sweeps the needle across the whole scale on a loop, with no
; WiFi and no deep sleep. Use it to fit the needle and check the end stops
; before wiring anything else up.
[env:bench]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DWINDCLOCK_BENCH_MODE=1
