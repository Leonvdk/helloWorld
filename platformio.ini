; Firmware build for the wind clock.
;
;   pio run -e esp32dev              build
;   pio run -e esp32dev -t upload    flash
;   pio device monitor               watch the serial log
;
; The unit tests do not need PlatformIO -- run `make test`.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; WiFi credentials. Keep real ones out of the repo: put them in a
    ; local, git-ignored `credentials.ini` and include it here, or pass
    ; them on the command line with `pio run -e esp32dev`.
    -DWINDCLOCK_WIFI_SSID='"${sysenv.WINDCLOCK_WIFI_SSID}"'
    -DWINDCLOCK_WIFI_PASSWORD='"${sysenv.WINDCLOCK_WIFI_PASSWORD}"'

build_unflags = -std=gnu++11
